<!DOCTYPE html>

<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    LEE COOPER - SCANNER
  </title>


  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 15px;
      background: #111;
      color: white;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    .container {
      max-width: 500px;
      margin: auto;
    }


    h2 {
      text-align: center;
      margin: 10px 0 5px;
      color: #fff;
    }


    .sub {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      margin-bottom: 15px;
    }


    #reader {
      width: 100%;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
    }


    .status {
      margin-top: 12px;
      padding: 14px;
      background: #222;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }


    .success {
      background: #155724;
    }


    .error {
      background: #651c1c;
    }


    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #C41230;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }


    #result {
      display: none;
      margin-top: 12px;
      background: #222;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }


    #skuResult {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

  </style>

</head>


<body>


<div class="container">

  <h2>
    LEE COOPER
  </h2>

  <div class="sub">
    SCAN BARCODE SKU
  </div>


  <div id="reader"></div>


  <div
    id="status"
    class="status"
  >
    📷 Memulai kamera...
  </div>


  <div
    id="result"
  >

    <div>
      BARCODE TERBACA
    </div>

    <div
      id="skuResult"
    >
      -
    </div>

  </div>


  <button
    type="button"
    onclick="tutupScanner()"
  >
    ✕ TUTUP
  </button>


</div>


<script>


/* =========================================================
   VARIABLES
   ========================================================= */

let scanner =
  null;


let scannerRunning =
  false;


let sudahScan =
  false;


/* =========================================================
   STATUS
   ========================================================= */

function status(
  text,
  type
) {

  const box =
    document.getElementById(
      "status"
    );


  box.innerHTML =
    text;


  box.className =
    "status " +
    (
      type ||
      ""
    );

}


/* =========================================================
   START SCANNER
   ========================================================= */

async function mulaiScanner() {

  try {

    /*
     * Pastikan HTTPS.
     */

    if (
      location.protocol !==
      "https:" &&
      location.hostname !==
      "localhost"
    ) {

      throw new Error(
        "Scanner harus dibuka melalui HTTPS."
      );

    }


    /*
     * Pastikan library ada.
     */

    if (
      typeof Html5Qrcode ===
      "undefined"
    ) {

      throw new Error(
        "Library scanner belum dimuat."
      );

    }


    status(
      "📷 Meminta izin kamera..."
    );


    /*
     * Buat instance.
     */

    scanner =
      new Html5Qrcode(
        "reader"
      );


    /*
     * Ambil kamera.
     *
     * TIDAK menggunakan facingMode.
     */

    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "Kamera tidak ditemukan."
      );

    }


    /*
     * Pilih kamera belakang berdasarkan label
     * jika browser sudah memberikan label.
     */

    let camera =
      cameras[0];


    for (
      const item of cameras
    ) {

      const label =
        String(
          item.label || ""
        ).toLowerCase();


      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment") ||
        label.includes("belakang")
      ) {

        camera =
          item;

        break;

      }

    }


    status(
      "📷 Kamera siap. Arahkan ke barcode."
    );


    /*
     * START
     *
     * Hanya menggunakan camera ID.
     * Tidak ada facingMode.
     */

    await scanner.start(

      camera.id,

      {

        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.min(
              width,
              height
            );


          return {

            width:
              Math.floor(
                size * .75
              ),

            height:
              Math.floor(
                size * .45
              )

          };

        },

        aspectRatio: 1.0,

        disableFlip: false

      },


      function(
        decodedText
      ) {

        barcodeBerhasil(
          decodedText
        );

      },


      function(
        errorMessage
      ) {

        /*
         * Jangan tampilkan error
         * tiap frame.
         */

      }

    );


    scannerRunning =
      true;


    status(
      "🟢 KAMERA AKTIF<br>Arahkan ke barcode SKU."
    );


  } catch (error) {

    console.error(
      error
    );


    status(
      "❌ KAMERA TIDAK DAPAT DIGUNAKAN<br><br>" +
      (
        error?.message ||
        error
      ) +
      "<br><br>" +
      "Pastikan Camera = Allow di browser.",
      "error"
    );

  }

}


/* =========================================================
   BARCODE BERHASIL
   ========================================================= */

async function barcodeBerhasil(
  decodedText
) {

  if (
    sudahScan
  ) {

    return;

  }


  sudahScan =
    true;


  const sku =
    String(
      decodedText || ""
    )
    .trim()
    .toUpperCase();


  if (!sku) {

    sudahScan =
      false;

    return;

  }


  document.getElementById(
    "skuResult"
  ).textContent =
    sku;


  document.getElementById(
    "result"
  ).style.display =
    "block";


  status(
    "✅ BARCODE TERBACA<br>" +
    "<b>" +
    sku +
    "</b>",
    "success"
  );


  /*
   * STOP CAMERA
   */

  await stopScanner();


  /*
   * Kirim SKU ke window utama
   */

  try {

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(

        {

          type:
            "LEE_COOPER_BARCODE",

          sku:
            sku

        },

        "*"

      );

    }


  } catch (error) {

    console.error(
      error
    );

  }


  /*
   * Tutup scanner setelah
   * barcode dikirim.
   */

  setTimeout(
    function() {

      window.close();

    },
    250
  );

}


/* =========================================================
   STOP
   ========================================================= */

async function stopScanner() {

  if (
    scanner &&
    scannerRunning
  ) {

    try {

      await scanner.stop();

    } catch (error) {

      console.log(
        error
      );

    }

  }


  scannerRunning =
    false;

}


/* =========================================================
   TUTUP
   ========================================================= */

async function tutupScanner() {

  await stopScanner();


  try {

    if (scanner) {

      await scanner.clear();

    }

  } catch (error) {

    console.log(
      error
    );

  }


  window.close();

}


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    mulaiScanner();

  }
);


/* =========================================================
   BACK / ESC
   ========================================================= */

document.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "Escape"
    ) {

      tutupScanner();

    }

  }
);

</script>

</body>

</html>
